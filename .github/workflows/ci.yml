name: Go CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true


    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Verify Generated Code
      run: |
        # Install oapi-codegen
        go install github.com/deepmap/oapi-codegen/cmd/oapi-codegen@latest
        
        # Generate code (Go only)
        ./scripts/generate_go_types.sh
        
        # Check for changes
        if [ -n "$(git status --porcelain)" ]; then 
          echo "❌ Generated code is out of sync with openapi.yaml";
          echo "Please run generation scripts locally and commit the changes.";
          git status;
          exit 1;
        fi

    - name: Run Unit Tests
      run: |
        go test -timeout=20s -v ./...

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Frontend Test Dependencies
      run: |
        cd web_dev
        npm install
        # Note: We rely on pre-built web/static artifacts, so no 'npm build' needed

    - name: Build and Start Backend Server
      run: |
        go build -o flow_sim cmd/server/main.go
        ./flow_sim &
        echo "Server started in background. Waiting for port 8080..."
        # Wait for port 8080 to be ready (loop with nc or curl)
        for i in {1..30}; do
          if curl -s http://localhost:8080 > /dev/null; then
            echo "Server is up!"
            break
          fi
          echo "Waiting..."
          sleep 1
        done

    - name: Run Frontend E2E Tests
      run: |
        cd web_dev
        npm run test:e2e

    - name: Run Performance Benchmark
      run: |
        scripts/perf_recorder.sh | tee benchmark_output.txt

    - name: Convert Benchmark Results to JSON
      run: |
        python3 scripts/bench_to_json.py < benchmark_output.txt > benchmark_data.json
        cat benchmark_data.json

    - name: Store Benchmark Result
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: ChampSim System Benchmarks
        tool: 'customBiggerIsBetter'
        output-file-path: benchmark_data.json
        # 即使失败也保存结果，方便调试
        fail-on-alert: true
        # 推送到 gh-pages 分支存储历史记录
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        # 只有在 main/master 分支才执行自动推送
        comment-on-alert: true
        alert-threshold: '200%'
        # 使用新的目录存储 sim_Hz 数据，相当于清空旧数据
        benchmark-data-dir-path: dev/bench_hz
