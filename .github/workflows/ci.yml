name: Go CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true  # Checkout top-level submodules only (prevents recursive error)

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Tidy dependencies
      run: go mod tidy

    - name: Run Schema Check & Unit Tests
      run: go test -v ./tests/... ./internal/core/visualization/...

    - name: Build All
      run: go build -v ./...
