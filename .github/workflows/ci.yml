name: Go CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false  # Disable built-in handling to avoid recursive errors

    - name: Checkout Submodules Manually
      run: |
        git submodule update --init web
        # Only init the top-level 'web' submodule, ignoring nested broken ones

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Tidy dependencies
      run: go mod tidy

    - name: Run Schema Check & Unit Tests
      run: go test -tags e2e -v ./tests/... ./internal/core/visualization/...

    - name: Build All
      run: go build -tags e2e -v ./...
