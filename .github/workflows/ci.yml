name: Go CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false  # Disable built-in handling to avoid recursive errors

    - name: Checkout Submodules Manually
      run: |
        git submodule update --init web
        # Only init the top-level 'web' submodule, ignoring nested broken ones

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Run Unit Tests
      run: |
        go test -timeout=3s -v ./...

    - name: Run FlowSimNetwork Integration Tests
      run: |
        go test -timeout=3s -v ./internal/core/visualization -run "TestFlowSim.*|TestStateToFlowSimNetwork"

    - name: Run Performance Benchmark
      run: |
        scripts/perf_recorder.sh | tee benchmark_output.txt

    - name: Convert Benchmark Results to JSON
      run: |
        python3 scripts/bench_to_json.py < benchmark_output.txt > benchmark_data.json
        cat benchmark_data.json

    - name: Store Benchmark Result
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: ChampSim System Benchmarks
        tool: 'customBiggerIsBetter'
        output-file-path: benchmark_data.json
        # 即使失败也保存结果，方便调试
        fail-on-alert: true
        # 推送到 gh-pages 分支存储历史记录
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        # 只有在 main/master 分支才执行自动推送
        comment-on-alert: true
        alert-threshold: '200%'
        # 使用新的目录存储 sim_Hz 数据，相当于清空旧数据
        benchmark-data-dir-path: dev/bench_hz
